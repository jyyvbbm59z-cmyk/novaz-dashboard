<!doctype html>
<html lang="es" data-theme="%novaz.tema%" style="%novaz.estilo%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0e0f11" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icono.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icono-192.png" />
		<script>
			// Tema "sistema": resolver antes de pintar para evitar parpadeo
			(function () {
				var h = document.documentElement;
				if (h.dataset.theme === 'sistema') {
					h.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
