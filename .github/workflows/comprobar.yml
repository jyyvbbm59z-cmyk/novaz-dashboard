name: Comprobar

# El despliegue lo hace Cloudflare (Workers Builds) al detectar el push: ver README.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
