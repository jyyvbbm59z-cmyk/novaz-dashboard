name: Comprobar y desplegar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  desplegar:
    needs: comprobar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migraciones de la base de datos (D1)
        working-directory: apps/web
        run: npx wrangler d1 migrations apply novaz --remote
      - name: Desplegar la app web
        working-directory: apps/web
        run: npm run deploy
      - name: Desplegar el worker de avisos
        working-directory: workers/avisos
        run: npx wrangler deploy
